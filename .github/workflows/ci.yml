# CI — feed-invariant and data-quality tests on every push and PR.
# Hermetic: node's built-in test runner over pure functions and static data;
# no network, no API keys, no Supabase.
#
# Note: Render auto-deploys main on push and does NOT wait for this workflow.
# A red run here means the deploy that just went out is suspect — revert or
# fix forward. To make CI actually gate deploys, turn off Render's auto-deploy
# and add a deploy-hook curl step behind these tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Deploy gate (opt-in): create a Render "deploy hook" URL, add it as the
  # RENDER_DEPLOY_HOOK repo secret, and turn OFF auto-deploy in Render —
  # from then on main only deploys after the matrix above is green.
  # Without the secret this job is a silent no-op, so committing it is safe.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy (only if hook configured)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping (Render auto-deploy still active)."
          fi
