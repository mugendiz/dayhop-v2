<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayHop — Internal Metrics</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#102A2E; --soft:#2C4A4E; --paper:#FBF7EE; --line:rgba(16,42,46,0.16); --coral:#FF6B4A; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 20px 64px; background:var(--paper); color:var(--ink);
         font-family: Inter, system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--soft); font-size: 13px; margin: 0 0 24px; }
  form { display:flex; gap:8px; margin-bottom:24px; }
  input { flex:1; max-width:320px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; }
  button { padding:10px 18px; border:none; border-radius:10px; background:var(--coral); color:white; font-weight:600; cursor:pointer; }
  table { width:100%; border-collapse:collapse; background:white; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:24px; }
  caption { text-align:left; font-weight:600; padding:12px 14px 4px; font-size:14px; }
  th, td { text-align:left; padding:9px 14px; font-size:13.5px; border-top:1px solid var(--line); }
  th { color:var(--soft); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; border-top:none; }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  .note { font-size:12.5px; color:var(--soft); }
  #error { color:#B3301B; font-size:13.5px; min-height:18px; margin-bottom:12px; }
</style>
</head>
<body>
<main>
  <h1>DayHop — Internal Metrics</h1>
  <p class="sub">Prompt → shortlist → booking funnel, daily activity, and billing status. Not linked from the app.</p>

  <form id="key-form">
    <input id="key" type="password" placeholder="Admin key" autocomplete="off">
    <button type="submit">Load metrics</button>
  </form>
  <p id="error"></p>

  <div id="report" hidden>
    <table>
      <caption>Totals</caption>
      <tbody id="totals"></tbody>
    </table>

    <table>
      <caption>Funnel</caption>
      <tbody id="funnel"></tbody>
    </table>

    <table>
      <caption>Daily (last 30 days)</caption>
      <thead>
        <tr><th>Day</th><th class="num">Prompts</th><th class="num">Shortlist adds</th>
            <th class="num">Outbound clicks</th><th class="num">Plans built</th>
            <th class="num">Active users</th><th class="num">New users</th></tr>
      </thead>
      <tbody id="daily"></tbody>
    </table>

    <p class="note" id="source"></p>
  </div>
</main>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);

  function row(label, value) {
    return '<tr><td>' + label + '</td><td class="num">' + value + '</td></tr>';
  }

  async function load(key) {
    $('error').textContent = '';
    try {
      const res = await fetch('/api/admin/metrics', { headers: { 'x-admin-key': key } });
      const data = await res.json();
      if (!res.ok) { $('error').textContent = data.message || ('Error ' + res.status); return; }

      const t = data.totals || {};
      $('totals').innerHTML =
        row('Prompts generated', t.prompts || 0) +
        row('Shortlist adds', t.shortlist_adds || 0) +
        row('Booking clicks', t.booking_clicks || 0) +
        row('Maps clicks', t.maps_clicks || 0) +
        row('Day plans built', t.plans_built || 0) +
        row('Distinct users/guests', t.distinct_users || 0) +
        row('Billing configured', data.billing && data.billing.configured ? 'yes' : 'no');

      const f = data.funnel || {};
      $('funnel').innerHTML =
        row('Prompts', f.prompts || 0) +
        row('→ Shortlist adds', f.shortlist_adds || 0) +
        row('→ Outbound clicks', f.outbound_clicks || 0) +
        row('Shortlist adds per prompt', f.prompt_to_shortlist == null ? '—' : f.prompt_to_shortlist) +
        row('Clicks per shortlist add', f.shortlist_to_click == null ? '—' : f.shortlist_to_click);

      $('daily').innerHTML = (data.daily || []).map(d =>
        '<tr><td>' + d.day + '</td><td class="num">' + d.prompts + '</td><td class="num">' + d.shortlist_adds +
        '</td><td class="num">' + d.booking_clicks + '</td><td class="num">' + d.plans_built +
        '</td><td class="num">' + d.active_users + '</td><td class="num">' + d.new_users + '</td></tr>'
      ).join('') || '<tr><td colspan="7">No activity yet.</td></tr>';

      $('source').textContent = 'Data source: ' + data.source + ' · generated ' + data.generated_at;
      $('report').hidden = false;
    } catch (e) {
      $('error').textContent = 'Could not reach the metrics endpoint.';
    }
  }

  $('key-form').addEventListener('submit', (e) => {
    e.preventDefault();
    load($('key').value.trim());
  });
})();
</script>
</body>
</html>
