<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your guide is ready — DayHop</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'National Park'; src: url('/fonts/NationalPark-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'National Park'; src: url('/fonts/NationalPark-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Crimson Pro'; src: url('/fonts/CrimsonPro-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    :root {
      --ink: #102A2E; --ink-soft: #41585C; --coral: #E1502F; --coral-dark: #C43F22;
      --moss: #3F6F5C; --paper: #FBF7EE; --line: #E3DCC9;
      --display: 'National Park', -apple-system, 'Segoe UI', sans-serif;
      --body: 'Crimson Pro', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: var(--body); background: var(--paper); color: var(--ink); line-height: 1.55; font-size: 1.05rem; }
    a { color: var(--coral); }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    .logo { font-family: var(--display); font-weight: 700; font-size: 1.3rem; color: var(--ink); text-decoration: none; letter-spacing: .02em; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; text-align: center; }
    h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; letter-spacing: .01em; }
    .status { color: var(--ink-soft); margin-top: 12px; }
    .dl { font-family: var(--display); display: none; background: var(--coral); color: #fff; border-radius: 10px; padding: 16px 26px; font-size: 1.05rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; margin-top: 26px; min-height: 44px; }
    .dl.show { display: inline-block; }
    .dl:hover { background: var(--coral-dark); }
    .fine { color: var(--ink-soft); font-size: .95rem; margin-top: 28px; }
    .planner-line { margin-top: 12px; color: var(--ink-soft); }
  </style>
</head>
<body>
  <div class="top">
    <a class="logo" href="/">DayHop</a>
  </div>
  <main>
    <h1 id="headline">Your guide is ready.</h1>
    <p class="status" id="status">Checking your purchase…</p>
    <a class="dl" id="download" href="#">Download PDF</a>
    <p class="fine">14-day refund: <a href="mailto:admin@dayhop.quest">admin@dayhop.quest</a></p>
    <p class="planner-line">A live day from one sentence is still free → <a href="/">the planner</a></p>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const dl = document.getElementById('download');
    const FALLBACK = 'Payment received? Your guide is on its way to your inbox (give it a minute or two). Trouble? admin@dayhop.quest';

    (async () => {
      const sid = new URLSearchParams(location.search).get('session_id') || '';
      if (!/^cs_[A-Za-z0-9_]+$/.test(sid)) { statusEl.textContent = FALLBACK; return; }
      try {
        const res = await fetch('/api/cityguides/claim?session_id=' + encodeURIComponent(sid));
        const data = await res.json();
        if (data && data.token) {
          const href = '/api/cityguides/download?t=' + encodeURIComponent(data.token);
          dl.href = href; dl.classList.add('show');
          statusEl.textContent = 'Your download is starting — a copy with a re-download link is in your inbox too.';
          window.location.href = href;
        } else {
          statusEl.textContent = FALLBACK;
        }
      } catch (e) {
        statusEl.textContent = FALLBACK;
      }
    })();
  </script>
</body>
</html>
