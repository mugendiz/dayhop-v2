<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayHop Guide</title>
<meta name="description" content="A DayHop day guide — real places, real plans.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #102A2E;
    --ink-soft: #2C4A4E;
    --paper: #FBF7EE;
    --paper-dim: #F2ECDC;
    --coral: #FF6B4A;
    --coral-dark: #E1502F;
    --line: rgba(16, 42, 46, 0.14);
    --line-strong: rgba(16, 42, 46, 0.28);
    --radius: 18px;
    --radius-md: 12px;
    --radius-pill: 999px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'Space Grotesk', 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--coral-dark); }

  .wrap { max-width: 680px; margin: 0 auto; padding: 28px 22px 140px; }

  .brand {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 26px;
  }
  .brand a.logo {
    font-family: var(--serif); font-weight: 650; font-size: 22px;
    color: var(--ink); text-decoration: none;
  }
  .brand .made-with { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft); }

  .guide-head h1 { font-family: var(--serif); font-weight: 650; font-size: clamp(28px, 6vw, 40px); line-height: 1.12; }
  .guide-meta { font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.06em; color: var(--ink-soft); margin-top: 10px; }
  .guide-start { margin-top: 20px; font-size: 15px; }
  .guide-start strong { color: var(--coral-dark); }
  .weather-chip {
    display: inline-block; margin-top: 12px; font-size: 13.5px; color: var(--ink-soft);
    background: white; border: 1px solid var(--line); border-radius: var(--radius-pill);
    padding: 5px 13px;
  }

  /* At-a-glance overview */
  .overview {
    margin-top: 22px; background: white; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px 18px;
  }
  .overview h3 {
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px;
  }
  .overview .ov-day { font-weight: 600; font-size: 13.5px; margin: 8px 0 2px; }
  .overview ol { list-style: none; }
  .overview li { display: flex; gap: 12px; font-size: 13.5px; padding: 2.5px 0; }
  /* flex: none — a full range ("10:00 AM - 12:30 PM") is wider than the 74px
     column, and a shrinkable nowrap item spills its text over the title
     beside it instead of widening. min-width still aligns short times. */
  .overview .ov-time {
    font-family: var(--mono); font-size: 12px; color: var(--coral-dark);
    min-width: 74px; white-space: nowrap; flex: none;
  }

  .stops { margin-top: 26px; display: flex; flex-direction: column; gap: 22px; }
  .stop {
    display: grid; grid-template-columns: 44px 1fr; gap: 14px;
    background: white; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px;
  }
  .stop-side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .stop-marker {
    font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--coral-dark);
    width: 44px; height: 44px; border: 1.5px solid var(--coral); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  /* Done-checkbox: tappable on screen (progress kept on this device),
     an empty square on paper. */
  .stop-check {
    width: 26px; height: 26px; border: 2px solid var(--line-strong); border-radius: 7px;
    background: white; cursor: pointer; font-size: 15px; line-height: 1; color: white;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .stop.done .stop-check { background: var(--coral); border-color: var(--coral); }
  .stop.done h2 { text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: 0.65; }
  .stop-time { font-family: var(--mono); font-size: 12px; letter-spacing: 0.07em; color: var(--ink-soft); text-transform: uppercase; }
  .stop h2 { font-family: var(--serif); font-weight: 650; font-size: 21px; margin: 2px 0 6px; }
  .stop-address { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .stop-photo { margin: 10px 0; border-radius: var(--radius-md); overflow: hidden; }
  .stop-photo img { width: 100%; max-height: 240px; object-fit: cover; display: block; }
  .stop-why { font-size: 14.5px; color: var(--ink-soft); }
  .stop-wow { font-size: 14px; margin-top: 8px; color: var(--coral-dark); }
  .stop-facts { margin-top: 10px; font-size: 13.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .stop-facts span { white-space: nowrap; }
  .stop-links { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stop-links a {
    font-size: 13px; font-weight: 600; text-decoration: none;
    border: 1px solid var(--line-strong); border-radius: var(--radius-pill);
    padding: 6px 13px; color: var(--ink);
  }
  .stop-links a.primary { background: var(--coral); border-color: var(--coral); color: white; }
  .stop-qr { display: none; }
  .transition {
    grid-column: 2; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 13.5px; color: var(--ink-soft); font-style: italic;
  }
  /* Ruled write-in lines (paper only) */
  .write-lines { display: none; }

  .guide-notes {
    margin-top: 28px; background: var(--paper-dim); border-radius: var(--radius);
    padding: 16px 18px; font-size: 14.5px; color: var(--ink-soft);
  }

  .day-header {
    font-family: var(--serif); font-weight: 650; font-size: 24px;
    margin: 34px 0 4px; padding-top: 22px; border-top: 1px dashed var(--line);
  }
  .day-header:first-child { margin-top: 6px; padding-top: 0; border-top: none; }
  .day-start { font-size: 14px; margin-bottom: 4px; }
  .day-start strong { color: var(--coral-dark); }
  .stop-note {
    margin-top: 8px; font-size: 13.5px; color: var(--ink-soft);
    background: var(--paper-dim); border-radius: var(--radius-md); padding: 7px 10px;
  }

  /* Companion cards: cost, packing, good-to-know, notes */
  .companion {
    margin-top: 26px; background: white; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .companion h3 {
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px;
  }
  .cost-row { display: flex; justify-content: space-between; gap: 14px; font-size: 13.5px; padding: 3px 0; }
  .cost-row .c-name { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cost-row .c-val { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
  .cost-total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; font-weight: 600; }
  .cost-foot { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  .pack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
  @media (max-width: 480px) { .pack-grid { grid-template-columns: 1fr; } }
  .pack-item { display: flex; align-items: center; gap: 9px; font-size: 13.5px; padding: 2.5px 0; }
  .pack-box { width: 15px; height: 15px; border: 1.5px solid var(--line-strong); border-radius: 4px; flex: none; }

  .gtk-line { display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; padding: 7px 0; }
  .gtk-line .gtk-label { color: var(--ink-soft); white-space: nowrap; }
  .gtk-line .gtk-fill { flex: 1; border-bottom: 1px solid var(--line-strong); min-height: 1.1em; }
  .gtk-emergency { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }

  .footer-cta { margin-top: 40px; text-align: center; font-size: 14px; color: var(--ink-soft); }
  .footer-cta a { font-weight: 600; }
  .print-footer { display: none; }

  /* ---------- export bar ---------- */
  .export-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(251, 247, 238, 0.96); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); padding: 12px 16px;
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
  }
  .export-bar button, .export-bar a {
    font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line-strong); background: white; color: var(--ink);
    border-radius: var(--radius-pill); padding: 8px 14px; text-decoration: none;
  }
  .export-bar .share-main { background: var(--coral); border-color: var(--coral); color: white; }

  .status { text-align: center; padding: 80px 20px; }
  .status h1 { font-family: var(--serif); font-size: 26px; margin-bottom: 10px; }
  .status a { font-weight: 600; }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font-size: 13.5px;
    padding: 10px 18px; border-radius: var(--radius-pill); opacity: 0;
    transition: opacity 0.2s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ---------- print: the keepable trip companion ---------- */
  @page { margin: 13mm; }
  /* Social vote MVP (shown only when /api/config.socialVote is true) */
.vote-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 14px 0 22px; padding: 14px 16px; background: #fff; border: 1px solid var(--line, #e6dfd0); border-radius: 14px; }
.vote-bar .vote-going { font: inherit; font-weight: 700; background: var(--coral, #FF6B4A); color: #fff; border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.vote-bar .vote-going.on { background: var(--moss, #3F6F5C); }
.vote-bar .vote-hint { font-size: 13.5px; color: #5c6664; flex: 1 1 220px; }
.stop-vote { display: flex; gap: 8px; margin-top: 10px; }
.stop-vote button { font: inherit; font-size: 14px; background: #fff; border: 1px solid var(--line, #e6dfd0); border-radius: 999px; padding: 6px 12px; cursor: pointer; color: inherit; }
.stop-vote button.on { border-color: var(--moss, #3F6F5C); background: #e9f1ec; }
.stop-vote button.on.down { border-color: var(--coral, #FF6B4A); background: #ffe6df; }
@media print {
  .vote-bar, .stop-vote { display: none !important; }
    .export-bar, .footer-cta, .toast { display: none !important; }
    body { background: white; font-size: 12.5px; line-height: 1.45; }
    .wrap { padding: 0; max-width: none; }
    .brand { margin-bottom: 14px; padding-bottom: 10px; }
    .guide-head h1 { font-size: 26px; }
    .guide-meta { margin-top: 4px; }
    .weather-chip { margin-top: 8px; padding: 2px 10px; border-color: #ccc; }

    .overview { margin-top: 14px; padding: 10px 14px; border-color: #bbb; break-inside: avoid; }
    .overview li { font-size: 12px; padding: 1.5px 0; }

    .stops { margin-top: 14px; gap: 10px; }
    .stop { break-inside: avoid; border-color: #bbb; padding: 12px 14px; border-radius: 10px; }
    .stop-photo { display: none; } /* ink-friendly */
    .stop h2 { font-size: 16.5px; }
    .stop-why { font-size: 12px; }
    .stop-facts { font-size: 11.5px; gap: 4px 12px; margin-top: 6px; }
    .stop-marker { width: 34px; height: 34px; font-size: 12px; }
    .stop-check { width: 22px; height: 22px; cursor: default; }
    .stop.done .stop-check::after { content: '✓'; color: white; font-size: 13px; }
    .stop-links a { border: none; padding: 0; font-weight: 400; font-size: 11px; color: #444; }
    .stop-links a.primary { background: none; color: #444; }
    .stop-links a::after { content: ' ' attr(href); font-size: 10px; color: #777; word-break: break-all; }
    /* When the stop has a QR (which encodes the map link), the printed map
       URL is redundant noise — the QR + address carry it. Booking URLs stay. */
    .stop.has-qr .stop-links a:not(.primary) { display: none; }
    .stop-qr { display: block; width: 58px; height: 58px; margin-top: 6px; }
    .stop-qr svg { width: 100%; height: 100%; display: block; }
    .transition { margin-top: 6px; padding-top: 6px; font-size: 11.5px; }
    .write-lines { display: block; margin-top: 8px; }
    .write-lines .wl { border-bottom: 1px solid #ccc; height: 17px; }
    .wl + .wl { margin-top: 4px; }

    .companion { break-inside: avoid; border-color: #bbb; margin-top: 12px; padding: 12px 14px; border-radius: 10px; }
    /* Multi-day trips: each day on its own sheet (class set by JS — a
       :last-of-type selector can't see past the sibling companion divs). */
    .day-section--page { break-after: page; }

    a { color: var(--ink); text-decoration: none; }
    .print-footer {
      display: flex; align-items: center; gap: 14px; margin-top: 18px;
      border-top: 1px solid #ccc; padding-top: 12px; font-size: 11px; color: #555;
    }
    .print-footer .qr { width: 72px; height: 72px; flex: none; }
    .print-footer .qr svg { width: 100%; height: 100%; display: block; }
  }
</style>
<script src="/pixel.js" defer></script>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <a class="logo" href="/">DayHop</a>
    <span class="made-with">DAY GUIDE</span>
  </div>
  <div id="guide-root">
    <div class="status"><h1>Loading your guide…</h1></div>
  </div>
  <p class="footer-cta">Made with <a href="/">DayHop</a> — plan your perfect day in one sentence.</p>
</div>

<div class="export-bar" id="export-bar" hidden>
  <button class="share-main" id="btn-share" type="button">📤 Share</button>
  <button id="btn-pdf" type="button">🖨️ Save as PDF</button>
  <a id="btn-email" href="#">✉️ Email</a>
  <button id="btn-download" type="button">💾 Save to file</button>
  <button id="btn-copy" type="button">🔗 Copy link</button>
</div>

<div class="toast" id="toast"></div>

<!-- defer: without it this cross-origin download blocked the inline script
     below — and with it the guide fetch — on every shared link open, for a
     library only the print/PDF view uses (qrCanvas already null-guards). -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
<script>
(function () {
  'use strict';

  var guide = null;
  var pageUrl = window.location.href.split('#')[0].split('?')[0];
  var shareId = window.location.pathname.split('/').filter(Boolean).pop();

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Stop photos are raw hotlinks from partner sites and Google place photos —
  // some refuse cross-site referrers, some expire. /api/img refetches them
  // server-side (resized, cached), the same path the main app uses, so the
  // guide isn't at the mercy of the original host. Own assets pass through.
  function proxiedImage(url, w) {
    if (!url || typeof url !== 'string') return url;
    if (url.startsWith('/') || url.startsWith('data:')) return url;
    if (!url.startsWith('https://')) return url;
    return '/api/img?u=' + encodeURIComponent(url) + '&w=' + (w || 640);
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  // QR as inline SVG — empty string when the generator didn't load (offline),
  // so the guide degrades to plain URLs.
  function qrSvg(url) {
    if (typeof qrcode !== 'function' || !url) return '';
    try {
      var qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      var n = qr.getModuleCount();
      var cells = [];
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) cells.push('<rect x="' + c + '" y="' + r + '" width="1" height="1"/>');
      }
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" fill="#102A2E">' + cells.join('') + '</svg>';
    } catch (e) { return ''; }
  }

  function mapsUrl(idea, stop) {
    if (idea.maps_url) return idea.maps_url;
    var q = [stop.title, idea.venue, idea.location, (guide.guide || {}).city].filter(Boolean).join(', ');
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  }

  function factsLine(idea) {
    var bits = [];
    if (idea.duration_minutes) bits.push('⏱ ~' + Math.round(idea.duration_minutes / 60 * 10) / 10 + ' h');
    if (idea.cost_tier) bits.push('💳 ' + esc(idea.cost_tier));
    if (idea.price_from != null) bits.push('from ' + esc(String(idea.price_from)) + (idea.currency ? ' ' + esc(idea.currency) : ''));
    if (idea.rating != null) bits.push('★ ' + esc(String(idea.rating)));
    if (idea.good_for_ages) bits.push('👶 ' + esc(idea.good_for_ages));
    return bits.map(function (b) { return '<span>' + b + '</span>'; }).join('');
  }

  // Multi-day guides carry a days[] array; single-day guides carry stops[].
  // Normalize to [{ label, start_time, notes, stops }] so both render alike.
  function dayGroups(g) {
    if (g.days && g.days.length) return g.days;
    return [{ label: null, start_time: g.start_time || '', notes: '', stops: g.stops || [] }];
  }

  function allStops(g) {
    return dayGroups(g).reduce(function (acc, d) { return acc.concat(d.stops || []); }, []);
  }

  // ---------- done-checkbox progress (per guide, this device only) ----------
  var PROGRESS_KEY = 'dayhop_guide_done_' + shareId;
  function doneSet() {
    try { return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY)) || []); } catch (e) { return new Set(); }
  }
  function saveDone(set) {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set])); } catch (e) {}
  }

  function stopHtml(stop, i, globalIndex, done) {
    var idea = stop.idea || {};
    var mUrl = mapsUrl(idea, stop);
    var qr = qrSvg(mUrl);
    var address = idea.venue && idea.location && idea.venue !== idea.location
      ? idea.venue + ' · ' + idea.location
      : (idea.location || idea.venue || '');
    return '<div class="stop' + (done.has(globalIndex) ? ' done' : '') + (qr ? ' has-qr' : '') + '" data-gi="' + globalIndex + '">' +
      '<div class="stop-side">' +
        '<div class="stop-marker">' + String(i + 1).padStart(2, '0') + '</div>' +
        '<button class="stop-check" type="button" title="Mark as done" aria-label="Mark stop as done">✓</button>' +
        '<div class="stop-qr">' + qr + '</div>' +
      '</div>' +
      '<div class="stop-body">' +
        (stop.suggested_time ? '<span class="stop-time">' + esc(stop.suggested_time) + '</span>' : '') +
        '<h2>' + esc(stop.title) + '</h2>' +
        (address ? '<p class="stop-address">📍 ' + esc(address) + '</p>' : '') +
        (idea.image_url ? '<div class="stop-photo"><img src="' + esc(proxiedImage(idea.image_url, 720)) +
          '" data-src-original="' + esc(idea.image_url) + '" alt="" loading="lazy"></div>' : '') +
        (idea.why ? '<p class="stop-why">' + esc(idea.why) + '</p>' : '') +
        (idea.wow_reason ? '<p class="stop-wow">✨ ' + esc(idea.wow_reason) + '</p>' : '') +
        (stop.note ? '<p class="stop-note">📝 ' + esc(stop.note) + '</p>' : '') +
        '<div class="stop-facts">' + factsLine(idea) + '</div>' +
        '<div class="stop-links">' +
          (idea.booking_url ? '<a class="primary" href="' + esc(idea.booking_url) + '" target="_blank" rel="noopener noreferrer sponsored">Book ↗</a>' :
            (idea.website ? '<a class="primary" href="' + esc(idea.website) + '" target="_blank" rel="noopener noreferrer">Site ↗</a>' : '')) +
          '<a href="' + esc(mUrl) + '" target="_blank" rel="noopener noreferrer">Map ↗</a>' +
        '</div>' +
        '<div class="write-lines"><div class="wl"></div><div class="wl"></div></div>' +
      '</div>' +
      (stop.transition_note ? '<div class="transition">→ ' + esc(stop.transition_note) + '</div>' : '') +
    '</div>';
  }

  // ---------- companion sections ----------
  function overviewHtml(g) {
    var groups = dayGroups(g);
    var body = groups.map(function (day) {
      var rows = (day.stops || []).map(function (stop, i) {
        return '<li><span class="ov-time">' + esc(stop.suggested_time || '·') + '</span><span>' +
          String(i + 1).padStart(2, '0') + ' — ' + esc(stop.title) + '</span></li>';
      }).join('');
      return (day.label ? '<p class="ov-day">' + esc(day.label) + '</p>' : '') + '<ol>' + rows + '</ol>';
    }).join('');
    return '<div class="overview"><h3>At a glance</h3>' + body + '</div>';
  }

  function costHtml(g) {
    var stops = allStops(g);
    var rows = '', totalFrom = 0, currency = '', priced = 0, unpriced = 0;
    stops.forEach(function (stop) {
      var idea = stop.idea || {};
      var val = '';
      if (idea.price_from != null) {
        val = 'from ' + idea.price_from + (idea.currency ? ' ' + idea.currency : '');
        totalFrom += Number(idea.price_from) || 0;
        currency = currency || idea.currency || '';
        priced++;
      } else if (idea.cost_tier) {
        val = idea.cost_tier === 'free' ? 'free' : idea.cost_tier;
        if (idea.cost_tier !== 'free') unpriced++;
      } else { unpriced++; val = '—'; }
      rows += '<div class="cost-row"><span class="c-name">' + esc(stop.title) + '</span><span class="c-val">' + esc(val) + '</span></div>';
    });
    if (!priced && !unpriced) return '';
    var total = priced
      ? '<div class="cost-row cost-total"><span class="c-name">Estimated day total</span><span class="c-val">from ' + totalFrom + (currency ? ' ' + currency : '') + '</span></div>'
      : '';
    var foot = unpriced ? '<p class="cost-foot">+ ' + unpriced + ' stop' + (unpriced > 1 ? 's' : '') + ' with variable cost (meals, pay-what-you-do).</p>' : '';
    return '<div class="companion"><h3>Cost snapshot</h3>' + rows + total + foot + '</div>';
  }

  function packingHtml(g) {
    var text = allStops(g).map(function (s) {
      var idea = s.idea || {};
      return [s.title, idea.why, idea.category, idea.good_for_ages].join(' ');
    }).join(' ').toLowerCase();
    var w = g.weather || {};
    var items = ['Phone + charger', 'Water bottle', 'Tickets & confirmations'];
    var add = function (arr) { arr.forEach(function (x) { if (items.indexOf(x) === -1) items.push(x); }); };
    if (/beach|swim|splash|pool|paddle|kayak|water park|lake|waterfront/.test(text)) add(['Swimwear & towel', 'Sunscreen', 'Change of clothes']);
    if (/park|trail|garden|hike|lookout|conservation|zoo|farm|island|falls|picnic/.test(text)) add(['Sunscreen', 'Hat & sunglasses', 'Bug spray', 'Comfortable walking shoes']);
    if (/zipline|climb|kart|bike|trampoline|axe|adventure|rafting|treetop|paintball/.test(text)) add(['Closed-toe shoes', 'Athletic wear']);
    if (/kid|child|family|toddler|ages 0|ages 2|ages 3|all ages/.test(text)) add(['Snacks for the kids', 'Wipes & hand sanitizer']);
    if (/restaurant|dinner|brunch|café|cafe|patio|food|bakery/.test(text)) add(['Check reservations']);
    if (/rain|drizzle|thunder/i.test((w.condition || '') + ' ' + (w.description || ''))) add(['Umbrella / rain jacket']);
    if (w.temp_c != null && w.temp_c <= 5) add(['Warm layers']);
    var cells = items.slice(0, 12).map(function (x) {
      return '<div class="pack-item"><span class="pack-box"></span>' + esc(x) + '</div>';
    }).join('');
    return '<div class="companion"><h3>What to bring</h3><div class="pack-grid">' + cells + '</div></div>';
  }

  function goodToKnowHtml() {
    var lineFor = function (label) {
      return '<div class="gtk-line"><span class="gtk-label">' + label + '</span><span class="gtk-fill"></span></div>';
    };
    return '<div class="companion"><h3>Good to know</h3>' +
      lineFor("Where we're staying") + lineFor('Parking / transit notes') + lineFor('Local contact') +
      '<p class="gtk-emergency">Emergency in Canada &amp; the US: <strong>911</strong></p></div>';
  }

  function dayNotesHtml() {
    var lines = '';
    for (var i = 0; i < 6; i++) lines += '<div class="gtk-line"><span class="gtk-fill"></span></div>';
    return '<div class="companion"><h3>Notes from the day</h3>' + lines + '</div>';
  }

  function render(data) {
    guide = data;
    var g = data.guide || {};
    var created = data.created_at ? new Date(data.created_at) : null;
    var meta = [];
    if (g.city) meta.push(esc(g.city));
    if (g.days && g.days.length > 1) meta.push(g.days.length + '-day trip');
    if (created) meta.push(created.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }));

    var weatherChip = '';
    if (g.weather && (g.weather.description || g.weather.temp_c != null)) {
      var wBits = [];
      if (g.weather.temp_c != null) wBits.push(g.weather.temp_c + '°C');
      if (g.weather.description) wBits.push(g.weather.description);
      weatherChip = '<span class="weather-chip">🌤 Planned for: ' + esc(wBits.join(', ')) + '</span>';
    }

    var done = doneSet();
    var globalIndex = 0;
    var groups = dayGroups(g);
    var sectionsHtml = groups.map(function (day) {
      var stopsHtml = (day.stops || []).map(function (stop, i) {
        return stopHtml(stop, i, globalIndex++, done);
      }).join('');
      var pageBreak = groups.length > 1 && day !== groups[groups.length - 1];
      return '<div class="day-section' + (pageBreak ? ' day-section--page' : '') + '">' +
        (day.label ? '<h2 class="day-header">' + esc(day.label) + '</h2>' : '') +
        (day.label && day.start_time ? '<p class="day-start">Starts around <strong>' + esc(day.start_time) + '</strong></p>' : '') +
        '<div class="stops">' + stopsHtml + '</div>' +
        (day.notes ? '<div class="guide-notes">💬 ' + esc(day.notes) + '</div>' : '') +
      '</div>';
    }).join('');

    document.title = (g.title || 'DayHop Guide') + ' — DayHop';
    document.getElementById('guide-root').innerHTML =
      '<div class="guide-head">' +
        '<h1>' + esc(g.title || 'Your day, mapped out') + '</h1>' +
        '<p class="guide-meta">' + meta.join(' · ') + '</p>' +
        weatherChip +
        (!g.days && g.start_time ? '<p class="guide-start">Starts around <strong>' + esc(g.start_time) + '</strong></p>' : '') +
      '</div>' +
      overviewHtml(g) +
      sectionsHtml +
      (g.notes ? '<div class="guide-notes">💬 ' + esc(g.notes) + '</div>' : '') +
      costHtml(g) +
      packingHtml(g) +
      goodToKnowHtml() +
      dayNotesHtml() +
      '<div class="print-footer"><div class="qr">' + qrSvg(pageUrl) + '</div>' +
        '<div>Scan to reopen this guide with live maps &amp; booking links.<br>' + esc(pageUrl) +
        '<br>Made with DayHop — plan your perfect day in one sentence.</div></div>';

    // A stop photo that never loads used to leave a tall bordered box with the
    // browser's broken-image glyph in it. Try the original host once (in case
    // the proxy, not the photo, is what failed), then drop the frame — the
    // stop still reads fine without a picture.
    document.querySelectorAll('.stop-photo img').forEach(function (img) {
      img.addEventListener('error', function () {
        var original = img.dataset.srcOriginal;
        if (original && img.dataset.retried !== '1' && img.src !== original) {
          img.dataset.retried = '1';
          img.src = original;
          return;
        }
        var frame = img.closest('.stop-photo');
        if (frame) frame.remove();
      });
    });

    // Done-checkboxes: tap to tick off a stop; survives reloads on this device.
    document.querySelectorAll('.stop-check').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var stopEl = btn.closest('.stop');
        var gi = Number(stopEl.dataset.gi);
        var set = doneSet();
        if (set.has(gi)) set.delete(gi); else set.add(gi);
        saveDone(set);
        stopEl.classList.toggle('done', set.has(gi));
      });
    });

    wireExports();
    document.getElementById('export-bar').hidden = false;

    // Opened from the in-app "PDF" button: go straight to the system print
    // dialog (where "Save as PDF" lives) once the layout has settled.
    if (new URLSearchParams(window.location.search).has('print')) {
      setTimeout(function () { window.print(); }, 600);
    }
  }

  function guideAsText() {
    var g = guide.guide || {};
    var lines = [g.title || 'Your DayHop guide'];
    if (g.city) lines.push(g.city);
    if (!g.days && g.start_time) lines.push('Starts around ' + g.start_time);
    lines.push('');
    dayGroups(g).forEach(function (day) {
      if (day.label) lines.push('— ' + day.label + (day.start_time ? ' (starts around ' + day.start_time + ')' : '') + ' —');
      (day.stops || []).forEach(function (stop, i) {
        var idea = stop.idea || {};
        lines.push((i + 1) + '. ' + stop.title + (stop.suggested_time ? ' (' + stop.suggested_time + ')' : ''));
        if (idea.location) lines.push('   ' + idea.location);
        if (stop.note) lines.push('   📝 ' + stop.note);
        if (stop.transition_note) lines.push('   → ' + stop.transition_note);
      });
    });
    lines.push('');
    lines.push('Full guide: ' + pageUrl);
    return lines.join('\n');
  }

  function guideAsMarkdown() {
    var g = guide.guide || {};
    var md = ['# ' + (g.title || 'Your DayHop guide'), ''];
    if (g.city) md.push('**Where:** ' + g.city + '  ');
    if (!g.days && g.start_time) md.push('**Starts around:** ' + g.start_time);
    md.push('');
    dayGroups(g).forEach(function (day) {
      if (day.label) {
        md.push('# ' + day.label);
        if (day.start_time) md.push('**Starts around:** ' + day.start_time);
        md.push('');
      }
      (day.stops || []).forEach(function (stop, i) {
        var idea = stop.idea || {};
        md.push('## ' + (i + 1) + '. ' + stop.title + (stop.suggested_time ? ' — ' + stop.suggested_time : ''));
        if (idea.why) md.push(idea.why);
        if (idea.location) md.push('- 📍 ' + idea.location);
        if (stop.note) md.push('- 📝 ' + stop.note);
        if (idea.booking_url) md.push('- [Book](' + idea.booking_url + ')');
        else if (idea.website) md.push('- [Official website](' + idea.website + ')');
        md.push('- [Map](' + mapsUrl(idea, stop) + ')');
        if (stop.transition_note) md.push('- → ' + stop.transition_note);
        md.push('');
      });
    });
    if (g.notes) md.push('> 💬 ' + g.notes);
    md.push('');
    md.push('Made with [DayHop](' + window.location.origin + ') — full guide: ' + pageUrl);
    return md.join('\n');
  }

  function wireExports() {
    var g = guide.guide || {};
    var shareTitle = g.title || 'My DayHop day guide';
    var shareText = shareTitle + (g.city ? ' — ' + g.city : '');

    document.getElementById('btn-share').addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: shareTitle, text: shareText, url: pageUrl }).catch(function () {});
      } else {
        // No Web Share API (desktop): open an X/Twitter intent as the default
        // social path, with the link already on the clipboard.
        copyLink(true);
        var intent = 'https://twitter.com/intent/tweet?text=' +
          encodeURIComponent(shareText) + '&url=' + encodeURIComponent(pageUrl);
        window.open(intent, '_blank', 'noopener');
      }
    });

    document.getElementById('btn-pdf').addEventListener('click', function () { window.print(); });

    var email = document.getElementById('btn-email');
    email.href = 'mailto:?subject=' + encodeURIComponent(shareTitle) +
      '&body=' + encodeURIComponent(guideAsText());

    document.getElementById('btn-download').addEventListener('click', function () {
      var blob = new Blob([guideAsMarkdown()], { type: 'text/markdown;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (g.title || 'dayhop-guide').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.md';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('Guide saved as Markdown');
    });

    document.getElementById('btn-copy').addEventListener('click', function () { copyLink(); });
  }

  function copyLink(quiet) {
    var done = function () { if (!quiet) toast('Link copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(pageUrl).then(done).catch(function () {});
    } else {
      var input = document.createElement('input');
      input.value = pageUrl;
      document.body.appendChild(input);
      input.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      input.remove();
    }
  }

  function showError(message) {
    document.getElementById('guide-root').innerHTML =
      '<div class="status"><h1>' + esc(message) + '</h1>' +
      '<p><a href="/">Plan your own day with DayHop →</a></p></div>';
  }

  // ---------- social vote MVP (flag: /api/config.socialVote) ----------
  // Whoever opens the link taps 👍/👎 per stop and "I'm in"; the owner sees
  // the tallies without a group chat. One vote per browser per stop (the
  // same guest id app.js uses). Everything here is additive: with the flag
  // off, none of it renders.
  function voterId() {
    try {
      var id = localStorage.getItem('dayhop_owner_id');
      if (!id) { id = 'guest-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('dayhop_owner_id', id); }
      return id;
    } catch (e) { return 'guest-' + Math.random().toString(36).slice(2, 10); }
  }

  function initVotes() {
    var voter = voterId();
    var head = document.querySelector('.guide-head');
    if (!head) return;
    var bar = document.createElement('div');
    bar.className = 'vote-bar';
    bar.innerHTML = '<button class="vote-going" type="button">✋ I\'m in</button>' +
      '<span class="vote-count"></span>' +
      '<span class="vote-hint">Send this link to whoever\'s coming. They tap what they like, you decide.</span>';
    head.insertAdjacentElement('afterend', bar);
    document.querySelectorAll('.stop[data-gi]').forEach(function (stopEl) {
      var links = stopEl.querySelector('.stop-links');
      if (!links) return;
      var v = document.createElement('div');
      v.className = 'stop-vote';
      v.innerHTML = '<button type="button" data-v="1">👍 <span>0</span></button>' +
        '<button type="button" class="down" data-v="-1">👎 <span>0</span></button>';
      links.insertAdjacentElement('afterend', v);
    });

    function paint(t) {
      var goingBtn = bar.querySelector('.vote-going');
      goingBtn.classList.toggle('on', Boolean(t.mine && t.mine.going));
      goingBtn.textContent = t.mine && t.mine.going ? '✋ You\'re in' : '✋ I\'m in';
      bar.querySelector('.vote-count').textContent = t.going ? t.going + (t.going === 1 ? ' person is in' : ' people are in') : '';
      document.querySelectorAll('.stop[data-gi]').forEach(function (stopEl) {
        var gi = String(stopEl.dataset.gi);
        var s = (t.stops && t.stops[gi]) || { up: 0, down: 0 };
        var mine = t.mine && t.mine.stops ? t.mine.stops[gi] : undefined;
        stopEl.querySelectorAll('.stop-vote button').forEach(function (b) {
          var val = Number(b.dataset.v);
          b.querySelector('span').textContent = val === 1 ? s.up : s.down;
          b.classList.toggle('on', mine === val);
        });
      });
    }

    function send(stop, vote) {
      return fetch('/api/guides/shared/' + encodeURIComponent(shareId) + '/vote', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ stop: stop, vote: vote, voter: voter })
      }).then(function (r) { return r.ok ? r.json() : null; }).then(function (t) { if (t) paint(t); });
    }

    bar.querySelector('.vote-going').addEventListener('click', function () {
      send('going', this.classList.contains('on') ? 0 : 1);
    });
    document.querySelectorAll('.stop-vote button').forEach(function (b) {
      b.addEventListener('click', function () {
        var gi = Number(b.closest('.stop').dataset.gi);
        send(gi, b.classList.contains('on') ? 0 : Number(b.dataset.v));
      });
    });

    fetch('/api/guides/shared/' + encodeURIComponent(shareId) + '/votes?v=' + encodeURIComponent(voter))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (t) { if (t) paint(t); })
      .catch(function () {});
  }

  var configReq = fetch('/api/config').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });

  fetch('/api/guides/shared/' + encodeURIComponent(shareId))
    .then(function (res) {
      if (!res.ok) throw new Error(res.status === 404 ? 'This guide does not exist or is no longer shared.' : 'Could not load this guide right now.');
      return res.json();
    })
    .then(function (data) {
      render(data);
      configReq.then(function (cfg) { if (cfg && cfg.socialVote) initVotes(); });
    })
    .catch(function (err) { showError(err.message); });
})();
</script>
</body>
</html>
